<section id="experience" class="experience">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">Experience</h2>
      <p class="section-subtitle">My professional journey and accomplishments</p>
    </div>
    
    <div class="timeline">
      <div class="timeline-item" *ngFor="let exp of experiences; let i = index">
        <div class="timeline-marker">
          <div class="timeline-dot"></div>
        </div>
        <div class="timeline-content" [class.left]="i % 2 === 0" [class.right]="i % 2 === 1">
          <div class="experience-card">
            <div class="experience-header">
              <h3>{{ exp.title }}</h3>
              <div class="company">
                <h4>{{ exp.company }}</h4>
                <span class="location">{{ exp.location }}</span>
              </div>
              <div class="duration">{{ exp.duration }}</div>
            </div>
            <div class="experience-body">
              <p class="description">{{ exp.description }}</p>
              <ul class="achievements">
                <li *ngFor="let achievement of exp.achievements">{{ achievement }}</li>
              </ul>
              <div class="technologies">
                <span class="tech-tag" *ngFor="let tech of exp.technologies">{{ tech }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
