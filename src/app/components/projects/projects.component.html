<section id="projects" class="projects">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">Featured Projects</h2>
      <p class="section-subtitle">Some of my recent work and accomplishments</p>
    </div>
    
    <div class="projects-grid">
      <div class="project-card" *ngFor="let project of projects">
        <div class="project-image">
          <img [src]="project.image" [alt]="project.title" 
               (error)="onImageError($event, project)"
               (load)="onImageLoad($event, project)" />
          <div class="image-fallback" *ngIf="project.imageError">
            <i class="fas fa-image"></i>
            <span>{{ project.title }}</span>
          </div>
          <div class="project-overlay">
            <div class="project-links">
              <a [href]="project.liveUrl" target="_blank" class="project-link" *ngIf="project.liveUrl">
                <i class="fas fa-external-link-alt"></i>
              </a>
              <a [href]="project.githubUrl" target="_blank" class="project-link" *ngIf="project.githubUrl">
                <i class="fab fa-github"></i>
              </a>
            </div>
          </div>
        </div>
        <div class="project-content">
          <div class="project-header">
            <h3>{{ project.title }}</h3>
            <span class="project-type">{{ project.type }}</span>
          </div>
          <p class="project-description">{{ project.description }}</p>
          <div class="project-features">
            <h4>Key Features:</h4>
            <ul>
              <li *ngFor="let feature of project.features">{{ feature }}</li>
            </ul>
          </div>
          <div class="project-technologies">
            <span class="tech-tag" *ngFor="let tech of project.technologies">{{ tech }}</span>
          </div>
          <div class="project-footer">
            <span class="project-date">{{ project.date }}</span>
            <span class="project-duration">{{ project.duration }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
